name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint + offline verification suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Some suites run under Node and rely on ESM detection for .js files (Node >= 22).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Service-free suites only: the Playwright and FastAPI-backed checks skip or need hardware.
      - name: Verify
        run: |
          set -e
          for suite in verify verify:fuzz verify:selection verify:mask verify:agent verify:history \
                       verify:subject-cleanup verify:nl-mask verify:stretch verify:collage \
                       verify:extend verify:crop-compose verify:chain-fold; do
            echo "::group::$suite"
            bun run "$suite"
            echo "::endgroup::"
          done
